# Sanitized template for the Private Collector Repository's GitHub Actions workflow.
# Copy to .github/workflows/cloud_snowball_runner.yml inside your PRIVATE collector repo
# and configure all required secrets in GitHub Actions Settings (never commit real values).
name: CBA-KB Cloud Snowball On-Demand Runner

on:
  repository_dispatch:
    types:
      - cba_kb_snowball_acquire
  workflow_dispatch:
    inputs:
      person:
        description: Target CBA person name or player_id
        required: true
        type: string
      season:
        description: Target CBA season
        required: false
        default: "2026-2027"
        type: string
      job_id:
        description: Cloud acquisition job identifier
        required: false
        default: ""
        type: string
      force_refresh:
        description: Bypass fresh cache and negative receipt TTL
        required: false
        default: false
        type: boolean

concurrency:
  group: cba-kb-snowball-${{ github.event.client_payload.season || inputs.season || '2026-2027' }}-${{ github.event.client_payload.person || inputs.person || 'default' }}
  cancel-in-progress: false

jobs:
  acquire-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CBA_KB_R2_ENDPOINT_URL: ${{ secrets.CBA_KB_R2_ENDPOINT_URL }}
      CBA_KB_R2_BUCKET: ${{ secrets.CBA_KB_R2_BUCKET }}
      CBA_KB_R2_ACCESS_KEY_ID: ${{ secrets.CBA_KB_R2_ACCESS_KEY_ID }}
      CBA_KB_R2_SECRET_ACCESS_KEY: ${{ secrets.CBA_KB_R2_SECRET_ACCESS_KEY }}
      CBA_KB_DRIVE_TOKEN_JSON: ${{ secrets.CBA_KB_DRIVE_TOKEN_JSON }}
      CBA_KB_DRIVE_SNOWBALL_FOLDER_ID: ${{ secrets.CBA_KB_DRIVE_SNOWBALL_FOLDER_ID }}
      INSTANCE_ROOT: ./workspace/cloud_instance
      TARGET_PERSON: ${{ github.event.client_payload.person || inputs.person }}
      TARGET_SEASON: ${{ github.event.client_payload.season || inputs.season || '2026-2027' }}
      TARGET_JOB_ID: ${{ github.event.client_payload.job_id || inputs.job_id }}
      FORCE_REFRESH: ${{ github.event.client_payload.force_refresh || inputs.force_refresh || 'false' }}
    steps:
      - name: Checkout private collector repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cba-kb-engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Pull cloud state snapshot from R2
        run: |
          cba-kb cloud-state-pull --output-dir ./workspace/cloud_instance

      - name: Execute on-demand snowball query and sync
        run: |
          EXTRA_FLAGS=""
          if [ "${FORCE_REFRESH}" = "true" ]; then
            EXTRA_FLAGS="--force-refresh"
          fi
          cba-kb snowball-query \
            --person "${TARGET_PERSON}" \
            --season "${TARGET_SEASON}" \
            --job-id "${TARGET_JOB_ID}" \
            --instance-root "${INSTANCE_ROOT:-.}" \
            --snowball-folder-id "${CBA_KB_DRIVE_SNOWBALL_FOLDER_ID}" \
            ${EXTRA_FLAGS}
